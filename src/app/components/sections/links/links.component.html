<section id="links" class="links-section animated-section" appScrollAnimation>
  <h2 class="section-title">
    <a href="#links" class="section-anchor-link" [class.active]="activeAnchorId() === 'links'" (click)="scrollToSection('links', $event)" title="Enlace a Mis Redes">
      <svg class="anchor-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 12 4 7"/>
        <line x1="12" y1="17" x2="20" y2="17"/>
      </svg>
    </a>
    Mis Redes
  </h2>

  <div class="web-links-list">
    <!-- GitHub -->
    <a href="https://github.com/lucasberonvonbrand" target="_blank" rel="noopener noreferrer" class="web-link-item">
      <div class="link-logo-container">
        <img src="assets/github-dark.svg" alt="GitHub" class="github-icon-dark link-icon-img">
        <img src="assets/github-light.svg" alt="GitHub" class="github-icon-light link-icon-img">
      </div>
      <div class="link-text-info">
        <h4 class="link-platform-name">GitHub</h4>
        <p class="link-username">&#64;lucasberonvonbrand</p>
      </div>
    </a>

    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/in/lucas-beron-von-brand-5aa37919a/" target="_blank" rel="noopener noreferrer" class="web-link-item">
      <div class="link-logo-container">
        <img src="assets/linkedin.svg" alt="LinkedIn" class="link-icon-img">
      </div>
      <div class="link-text-info">
        <h4 class="link-platform-name">LinkedIn</h4>
        <p class="link-username">lucasberonvonbrand</p>
      </div>
    </a>

    <!-- Email Directo -->
    <a href="mailto:lucasberonvonbrand@gmail.com" class="web-link-item">
      <div class="link-logo-container">
        <img src="assets/gmail.svg" alt="Gmail" class="link-icon-img">
      </div>
      <div class="link-text-info">
        <h4 class="link-platform-name">Email</h4>
        <p class="link-username">lucasberonvonbrand&#64;gmail.com</p>
      </div>
    </a>
  </div>
</section>
