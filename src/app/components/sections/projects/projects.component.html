<section id="proyectos" class="projects-section">
  <div class="section-header">
    <h2 class="section-title">
      <a href="#proyectos" class="section-anchor-link" [class.active]="activeAnchorId() === 'proyectos'" (click)="scrollToSection('proyectos', $event)" title="Enlace a Proyectos Destacados">
        <svg class="anchor-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 12 4 7"/>
          <line x1="12" y1="17" x2="20" y2="17"/>
        </svg>
      </a>
      Proyectos Destacados
    </h2>
  </div>

  <!-- Grilla Minimalista de 2 Columnas (Estilo Takuya Matsuyama) -->
  <div class="projects-grid">
    <div
      *ngFor="let project of projects"
      class="project-card"
      (click)="navigateToProject(project.id)">
      
      <!-- Portada de Tarjeta (Logo oficial para Fullstack / Banner de Arquitectura para Backend) -->
      <div class="card-thumbnail" [style.background-color]="project.coverBg || 'var(--card-background-color)'">
        <!-- Logo Oficial del Proyecto -->
        <img
          *ngIf="project.coverImage"
          [src]="project.coverImage"
          [alt]="project.title"
          class="cover-logo-img"
          [class.fit-contain]="project.coverFit === 'contain'"
          [class.fit-cover]="project.coverFit === 'cover'"
          [style.background-color]="project.coverFit === 'contain' ? (project.coverBg || '#ffffff') : 'transparent'"
          loading="lazy">

        <!-- Portada de Arquitectura Backend / DevOps -->
        <div *ngIf="!project.coverImage && project.coverType === 'tasks'" class="tech-banner tasks-banner">
          <div class="banner-badge">
            <img src="assets/angular.svg" alt="Angular" class="banner-icon">
            <img src="assets/springboot.svg" alt="Spring Boot" class="banner-icon">
            <img src="assets/docker.svg" alt="Docker" class="banner-icon">
          </div>
          <span class="banner-label">CI/CD Pipeline & Docker</span>
        </div>

        <div *ngIf="!project.coverImage && project.coverType === 'microservices'" class="tech-banner microservices-banner">
          <div class="banner-badge">
            <img src="assets/java.svg" alt="Java" class="banner-icon">
            <img src="assets/springboot.svg" alt="Spring Boot" class="banner-icon">
            <img src="assets/springcloud.svg" alt="Spring Cloud" class="banner-icon">
          </div>
          <span class="banner-label">Microservices Architecture</span>
        </div>

        <div *ngIf="!project.coverImage && project.coverType === 'security'" class="tech-banner security-banner">
          <div class="banner-badge">
            <img src="assets/springsecurity.svg" alt="Spring Security" class="banner-icon">
            <img src="assets/jwt.svg" alt="JWT" class="banner-icon">
            <img src="assets/oauth.svg" alt="OAuth2" class="banner-icon">
          </div>
          <span class="banner-label">Spring Security & OAuth2 API</span>
        </div>
      </div>

      <!-- Título e Iconos de Tecnologías -->
      <div class="card-body">
        <h3 class="card-title">{{ project.title }}</h3>

        <!-- Iconos de Tecnologías -->
        <div class="card-tech-icons">
          <ng-container *ngFor="let tech of project.technologies">
            <img
              *ngIf="getTechIcon(tech)"
              [src]="'assets/' + getTechIcon(tech)"
              [alt]="tech"
              [title]="tech"
              class="card-tech-icon" />
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</section>
