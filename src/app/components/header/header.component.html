<header class="header-container">
  <div class="header-content">
    <a routerLink="/" class="brand-logo">
      <span class="brand-name">Lucas Beron Von Brand</span>
    </a>

    <nav class="header-nav">
      <div class="nav-links">
        <a routerLink="/" fragment="sobre-mi">Sobre Mí</a>
        <a routerLink="/" fragment="tecnologias">Tecnologías</a>
        <a routerLink="/" fragment="proyectos">Proyectos</a>
        <a routerLink="/" fragment="education">Educación</a>
        <a routerLink="/" fragment="contacto">Contacto</a>
      </div>

      <!-- Selector de Tema Píldora (Estilo Gift Egwuenu) -->
      <div class="theme-switcher">
        <button
          type="button"
          class="theme-btn"
          [class.active]="themeService.currentTheme() === 'light'"
          (click)="setTheme('light')"
          title="Modo Claro"
          aria-label="Modo Claro">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>

        <button
          type="button"
          class="theme-btn"
          [class.active]="themeService.currentTheme() === 'system'"
          (click)="setTheme('system')"
          title="Preferencia del Sistema"
          aria-label="Preferencia del Sistema">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
          </svg>
        </button>

        <button
          type="button"
          class="theme-btn"
          [class.active]="themeService.currentTheme() === 'dark'"
          (click)="setTheme('dark')"
          title="Modo Oscuro"
          aria-label="Modo Oscuro">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </nav>
  </div>
</header>
