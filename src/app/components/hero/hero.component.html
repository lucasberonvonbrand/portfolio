<section class="hero-section">
  <div class="hero-content">
    <div class="hero-header">
      <div class="hero-text">
        <h1 class="hero-title">
          Hola, soy <span class="typed-name">{{ displayedName() }}</span><span class="cursor-caret" [class.blink]="isTypingComplete()">|</span>
        </h1>
        <p class="hero-subtitle">Desarrollador Fullstack & Java Backend | Lic. en Gestión de Tecnología</p>
      </div>

      <!-- Tarjeta de Foto de Perfil con Efecto 3D Tilt e Inclinación por Defecto -->
      <div
        #photoCard
        class="hero-photo"
        (mousemove)="onMouseMove($event, photoCard)"
        (mouseleave)="onMouseLeave(photoCard)">
        <img src="assets/foto-perfil.jpeg" alt="Foto de Lucas Beron Von Brand">
      </div>
    </div>
  </div>
</section>
