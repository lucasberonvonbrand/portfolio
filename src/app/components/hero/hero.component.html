<section class="hero-section">
  <!-- Selector de Tema Discreto en la parte superior derecha -->
  <div class="hero-top-bar">
    <div class="theme-switcher">
      <button
        type="button"
        class="theme-btn"
        [class.active]="themeService.currentTheme() === 'light'"
        (click)="setTheme('light')"
        title="Modo Claro"
        aria-label="Modo Claro">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>

      <button
        type="button"
        class="theme-btn"
        [class.active]="themeService.currentTheme() === 'dark'"
        (click)="setTheme('dark')"
        title="Modo Oscuro"
        aria-label="Modo Oscuro">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="hero-content">
    <div class="hero-header">
      <div class="hero-text">
        <h1 class="hero-title">
          Hola, soy <span class="typed-name">{{ displayedName() }}</span><span class="cursor-caret" [class.blink]="isTypingComplete()">|</span>
        </h1>
        <p class="hero-subtitle">Desarrollador Fullstack & Java Backend | Lic. en Gestión de Tecnología</p>
      </div>

      <!-- Tarjeta de Foto de Perfil con Efecto 3D Tilt e Inclinación por Defecto -->
      <div
        #photoCard
        class="hero-photo"
        (mousemove)="onMouseMove($event, photoCard)"
        (mouseleave)="onMouseLeave(photoCard)">
        <img src="assets/foto-perfil.jpeg" alt="Foto de Lucas Beron Von Brand">
      </div>
    </div>
  </div>
</section>
