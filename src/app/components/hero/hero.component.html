<section class="hero-section">
  <div class="hero-content">
    <div class="hero-header">
      <div class="hero-text">
        <h1 class="hero-title">
          Hola, soy <span class="typed-name">{{ displayedName() }}</span><span class="cursor-caret" [class.blink]="isTypingComplete()">|</span>
        </h1>
        <p class="hero-subtitle">Desarrollador Fullstack & Java Backend | Lic. en Gestión de Tecnología</p>
      </div>

      <!-- Tarjeta de Foto de Perfil con Efecto 3D Tilt e Inclinación por Defecto -->
      <div
        #photoCard
        class="hero-photo"
        (mousemove)="onMouseMove($event, photoCard)"
        (mouseleave)="onMouseLeave(photoCard)">
        <img src="assets/foto-perfil.jpeg" alt="Foto de Lucas Beron Von Brand">
      </div>
    </div>

    <!-- Píldoras de Redes / Contacto estilo Hiroki Osame -->
    <div class="social-pills">
      <a href="https://github.com/lucasberonvonbrand" target="_blank" class="social-pill">
        <img src="assets/github-dark.svg" alt="GitHub" class="github-icon-dark pill-icon-asset">
        <img src="assets/github-light.svg" alt="GitHub" class="github-icon-light pill-icon-asset">
        <span>@lucasberonvonbrand</span>
      </a>

      <a href="https://www.linkedin.com/in/lucas-beron-von-brand-5aa37919a/" target="_blank" class="social-pill">
        <img src="assets/linkedin.svg" alt="LinkedIn" class="pill-icon-asset">
        <span>lucasberonvonbrand</span>
      </a>

      <a href="assets/CV-Lucas-Ruben-Beron-Von-Brand.pdf" target="_blank" class="social-pill cv-pill">
        <img src="assets/cv.svg" alt="CV" class="cv-icon-img pill-icon-asset">
        <span>Descargar CV</span>
      </a>
    </div>
  </div>
</section>
