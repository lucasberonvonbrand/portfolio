<section id="education"
         class="education-section animated-section"
         appScrollAnimation>
  <h2>Educación y Certificaciones</h2>

  <!-- Subsección: Formación Académica -->
  <div class="education-block">
    <h3 class="subsection-title">Formación Académica</h3>
    
    <div *ngFor="let edu of academicEducation" class="education-item-container">
      <img [src]="getLogo(edu)" [alt]="edu.institution + ' logo'" class="education-logo">
      <div class="education-item">
        <h3>{{ edu.degree }}</h3>
        <p class="institution">{{ edu.institution }}, {{ edu.period }}</p>
        <p>{{ edu.description }}</p>
      </div>
    </div>
  </div>

  <!-- Subsección: Cursos y Certificaciones -->
  <div class="education-block certifications-block">
    <h3 class="subsection-title">Cursos y Certificaciones</h3>

    <div class="certifications-grid">
      <div *ngFor="let cert of certifications" class="cert-card">
        <div class="cert-header">
          <span class="cert-platform">{{ cert.platform }}</span>
          <span class="cert-year">{{ cert.year }}</span>
        </div>
        <h4 class="cert-title">{{ cert.title }}</h4>
      </div>
    </div>
  </div>
</section>
