<!-- Botón Flotante Volver Arriba Global -->
<button
  type="button"
  class="scroll-to-top-btn"
  [class.visible]="showScrollTop()"
  (click)="scrollToTop()"
  title="Volver arriba"
  aria-label="Volver arriba">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="scroll-icon">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
